<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Atlas - A map of places to stay a while</title>
    <meta name="description" content="A map of places anyone can walk into and stay a while. Cafes, libraries, parks, museums, makerspaces and hotel lobbies, rated by the people who use them." />
    <meta property="og:title" content="Atlas - A community-built map of third spaces" />
    <meta property="og:description" content="Find a place to work, gather or make things. Third spaces rated on seating, wifi, power, access and hours by the people who use them." />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preload" href="/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- A chosen theme applies before the first paint, so the page never flashes the other one -->
    <script>
      try {
        var t = localStorage.getItem("atlas-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
